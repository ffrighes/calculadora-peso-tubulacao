<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grok Studio • Calculadora de Peso de Tubulação</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        
        body {
            font-family: 'Inter', system_ui, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            margin: 0;
            padding: 2rem 1rem;
        }
        
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        
        .header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
        }
        
        .artifact-card {
            background-color: #1e2937;
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.25);
        }
        
        .input-label {
            display: block;
            font-size: 0.95rem;
            font-weight: 500;
            color: #94a3b8;
            margin-bottom: 8px;
        }
        
        .input-field {
            width: 100%;
            background-color: #334155;
            border: 1px solid #475569;
            border-radius: 16px;
            padding: 14px 18px;
            color: #f1f5f9;
            font-size: 1.05rem;
        }
        
        .input-field:focus {
            border-color: #0ea5e9;
            outline: none;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
        }
        
        .btn-primary {
            width: 100%;
            background-color: #0ea5e9;
            color: white;
            font-weight: 600;
            font-size: 1.1rem;
            padding: 18px;
            border-radius: 9999px;
            margin-top: 16px;
            transition: all 0.2s;
        }
        
        .btn-primary:hover {
            background-color: #0284c8;
        }
        
        .result-card {
            background-color: #f8fafc;
            color: #0f172a;
            border-radius: 24px;
            padding: 32px;
        }
        
        .result-value {
            font-size: 3.2rem;
            font-weight: 600;
            line-height: 1;
        }

        .btn-pdf {
            width: 100%;
            background-color: #0ea5e9;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            padding: 14px;
            border-radius: 9999px;
            margin-top: 20px;
            transition: all 0.2s;
            cursor: pointer;
            border: none;
            display: none;
        }

        .btn-pdf:hover {
            background-color: #0284c8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="w-14 h-14 bg-sky-500 rounded-2xl flex items-center justify-center text-4xl shadow-lg">📐</div>
            <div>
                <h1 class="text-3xl font-semibold text-white">Calculadora de Peso de Tubulação</h1>
                <p class="text-slate-400">Artefato Grok Studio • Espessura controlada por Schedule para aço</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <!-- Painel de Entrada -->
            <div class="lg:col-span-5 artifact-card">
                <h2 class="text-xl font-medium mb-8 text-slate-100">Parâmetros da Tubulação</h2>
                
                <div class="space-y-7">
                    <!-- Material -->
                    <div>
                        <label class="input-label">Material</label>
                        <select id="material" onchange="updateInterface()" class="input-field">
                            <option value="Aço Carbono" selected>Aço Carbono (ASME B36.10)</option>
                            <option value="Inox">Aço Inoxidável (ASME B36.19)</option>
                            <option value="Cobre">Cobre (ASTM B88 Type L)</option>
                            <option value="Alumínio">Alumínio (comercial)</option>
                        </select>
                    </div>

                    <!-- Bitola -->
                    <div>
                        <label class="input-label">Bitola Nominal (NPS – polegadas)</label>
                        <select id="nps" onchange="updateDimensions()" class="input-field"></select>
                    </div>

                    <!-- Schedule (visível apenas para Aço Carbono e Inox) -->
                    <div id="schedule_group">
                        <label class="input-label">Schedule</label>
                        <select id="schedule" onchange="updateDimensions()" class="input-field"></select>
                    </div>

                    <!-- Espessura (somente leitura - atualizada automaticamente) -->
                    <div>
                        <label class="input-label">Espessura da Parede</label>
                        <div class="relative">
                            <input type="text" id="thickness" readonly class="input-field bg-slate-700 cursor-default">
                            <span class="absolute right-5 top-1/2 -translate-y-1/2 text-slate-400 text-sm">mm</span>
                        </div>
                    </div>

                    <!-- Comprimento -->
                    <div>
                        <label class="input-label">Comprimento do tubo (metros)</label>
                        <input type="number" id="length" value="1.00" step="0.01" min="0.01" class="input-field">
                    </div>

                    <button onclick="calcularPeso()" class="btn-primary">
                        Calcular Peso
                    </button>
                </div>
            </div>

            <!-- Resultados -->
            <div class="lg:col-span-7 result-card">
                <h2 class="text-2xl font-semibold mb-8 text-slate-900">Resultados do Cálculo</h2>
                
                <div class="grid grid-cols-2 gap-6 mb-10">
                    <div class="bg-white rounded-3xl p-7 shadow">
                        <div class="text-slate-500 text-sm mb-1">Peso por metro</div>
                        <div id="weight_per_m" class="result-value text-slate-900">—</div>
                        <div class="text-slate-400 text-lg">kg/m</div>
                    </div>
                    <div class="bg-white rounded-3xl p-7 shadow">
                        <div class="text-slate-500 text-sm mb-1">Peso total</div>
                        <div id="total_weight" class="result-value text-slate-900">—</div>
                        <div class="text-slate-400 text-lg">kg</div>
                    </div>
                </div>

                <div class="bg-white rounded-3xl p-7 shadow">
                    <h3 class="font-semibold text-slate-700 mb-5">Memorial de Cálculo</h3>
                    <div id="memorial" class="space-y-4 text-slate-600 text-[15px]"></div>
                </div>

                <button id="btn_pdf" onclick="exportarPDF()" class="btn-pdf">📄 Exportar PDF</button>
            </div>
        </div>

        <div class="text-center text-xs text-slate-500 mt-12">
            Artefato Grok Studio • Espessura controlada por Schedule para tubos de aço
        </div>
    </div>

            "2":    { od: 60.3, schedules: { "SCH 5S": 1.65, "SCH 10S": 2.77, "SCH 40S": 3.91, "SCH 80S": 5.54 } },
            "2 1/2":{ od: 73.0, schedules: { "SCH 5S": 2.11, "SCH 10S": 3.05, "SCH 40S": 5.16, "SCH 80S": 7.01 } },

        };

        const copperSizes = [
            {nps: "1/4", od: 9.53, t: 0.89}, {nps: "3/8", od: 12.70, t: 1.14},

            {nps: "4", od: 104.78, t: 2.79}
        ];

        const aluminumSizes = [
            {nps: "1/2", od: 21.3, t: 2.77}, {nps: "3/4", od: 26.7, t: 2.87},
            {nps: "1", od: 33.4, t: 3.38}, {nps: "2", od: 60.3, t: 3.91}
        ];

        const densities = {
            "Aço Carbono": 7850,
            "Inox": 8000,
            "Cobre": 8960,
            "Alumínio": 2700
        };

        function updateInterface() {
            const material = document.getElementById("material").value;
            const scheduleGroup = document.getElementById("schedule_group");

            if (material === "Aço Carbono" || material === "Inox") {
                scheduleGroup.style.display = "block";
            } else {
                scheduleGroup.style.display = "none";
            }
            populateNPS();
            populateSchedules(material);
        }

        function populateNPS() {
            const material = document.getElementById("material").value;
            const select = document.getElementById("nps");
            select.innerHTML = "";

            let list = [];
            if (material === "Aço Carbono") list = Object.keys(b36_10).map(nps => ({nps, od: b36_10[nps].od}));
            else if (material === "Inox") list = Object.keys(b36_19).map(nps => ({nps, od: b36_19[nps].od}));
            else if (material === "Cobre") list = copperSizes.map(s => ({nps: s.nps, od: s.od}));
            else list = aluminumSizes.map(s => ({nps: s.nps, od: s.od}));

            list.sort((a, b) => a.od - b.od);

            list.forEach(item => {
                const opt = document.createElement("option");
                opt.value = item.nps;
                opt.textContent = `${item.nps}" (OD ${item.od.toFixed(1)} mm)`;
                select.appendChild(opt);
            });
            updateDimensions();
        }

        function populateSchedules(material) {
            const select = document.getElementById("schedule");
            select.innerHTML = "";
            let opts = [];
            if (material === "Aço Carbono") opts = ["SCH 40", "SCH 80", "STD", "XS"];
            else if (material === "Inox") opts = ["SCH 5S", "SCH 10S", "SCH 40S", "SCH 80S"];
            opts.forEach(s => {
                const opt = document.createElement("option");
                opt.value = s;
                opt.textContent = s;
                select.appendChild(opt);
            });
        }

        function updateDimensions() {
            const material = document.getElementById("material").value;
            const nps = document.getElementById("nps").value;
            const schedule = document.getElementById("schedule").value;

            let data = null;
            if (material === "Aço Carbono" && b36_10[nps]) data = b36_10[nps];
            else if (material === "Inox" && b36_19[nps]) data = b36_19[nps];

            if (data && schedule && data.schedules[schedule]) {
                document.getElementById("thickness").value = data.schedules[schedule].toFixed(2);
            } else if (material === "Cobre") {
                const found = copperSizes.find(s => s.nps === nps);
                if (found) document.getElementById("thickness").value = found.t.toFixed(2);
            } else if (material === "Alumínio") {
                const found = aluminumSizes.find(s => s.nps === nps);
                if (found) document.getElementById("thickness").value = found.t.toFixed(2);
            }
        }

        window.calcularPeso = function() {
            const material = document.getElementById("material").value;
            const nps = document.getElementById("nps").value;
            const t = parseFloat(document.getElementById("thickness").value) || 0;
            const length = parseFloat(document.getElementById("length").value) || 1;
            const density = densities[material];

            let od = 0;
            if (material === "Aço Carbono" && b36_10[nps]) od = b36_10[nps].od;
            else if (material === "Inox" && b36_19[nps]) od = b36_19[nps].od;
            else if (material === "Cobre") {
                const found = copperSizes.find(s => s.nps === nps);
                if (found) od = found.od;
            } else if (material === "Alumínio") {
                const found = aluminumSizes.find(s => s.nps === nps);
                if (found) od = found.od;
            }

            if (od <= 0 || t <= 0) {
                alert("Por favor, selecione uma bitola e schedule válidos.");
                return;
            }

            const area = Math.PI * (od * t - t * t);
            const weightPerM = (area * density) / 1000000;
            const totalWeight = weightPerM * length;

            document.getElementById("weight_per_m").textContent = weightPerM.toFixed(2);
            document.getElementById("total_weight").textContent = totalWeight.toFixed(2);

            const norma = material === "Aço Carbono" ? "ASME B36.10" : 
                         (material === "Inox" ? "ASME B36.19" : 
                         (material === "Cobre" ? "ASTM B88 Type L" : "Dimensões comerciais"));

            const memorialHTML = `
                <div><strong>Material:</strong> ${material} — Densidade = ${density} kg/m³</div>
                <div><strong>Norma:</strong> ${norma}</div>
                <div><strong>Dimensões:</strong> NPS ${nps}" | OD = ${od.toFixed(1)} mm | Espessura = ${t.toFixed(2)} mm</div>
                <div class="font-mono mt-2">Área transversal = ${area.toFixed(2)} mm²</div>
                <div class="font-mono">Peso linear = ${weightPerM.toFixed(4)} kg/m</div>
                <div class="font-mono">Peso total (${length.toFixed(2)} m) = ${totalWeight.toFixed(2)} kg</div>
            `;
            document.getElementById("memorial").innerHTML = memorialHTML;
            document.getElementById("btn_pdf").style.display = "block";
        };

        window.exportarPDF = function() {
            const btn = document.getElementById('btn_pdf');

            // Coletar dados atuais da tela
            const material  = document.getElementById('material').value;
            const nps       = document.getElementById('nps').value;
            const thickness = document.getElementById('thickness').value;
            const length    = document.getElementById('length').value;
            const schedule  = document.getElementById('schedule_group').style.display !== 'none'
                              ? document.getElementById('schedule').value : '—';
            const weightPerM  = document.getElementById('weight_per_m').textContent;
            const totalWeight = document.getElementById('total_weight').textContent;

            const norma = material === 'Aço Carbono' ? 'ASME B36.10' :
                         (material === 'Inox'        ? 'ASME B36.19' :
                         (material === 'Cobre'       ? 'ASTM B88 Type L' : 'Dimensões comerciais'));

            const density = densities[material];

            let od = 0;
            if (material === 'Aço Carbono' && b36_10[nps]) od = b36_10[nps].od;
            else if (material === 'Inox'   && b36_19[nps]) od = b36_19[nps].od;
            else if (material === 'Cobre') { const f = copperSizes.find(s => s.nps === nps);   if (f) od = f.od; }
            else                           { const f = aluminumSizes.find(s => s.nps === nps); if (f) od = f.od; }

            const t    = parseFloat(thickness);
            const area = Math.PI * (od * t - t * t);
            const now  = new Date().toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });

            const html = `
<div style="font-family: 'Inter', Arial, sans-serif; color: #1e293b; padding: 0; background: #fff;">

    <div style="flex: 1; background: #0ea5e9; border-radius: 12px; padding: 22px 24px; text-align: center;">
      <div style="font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: rgba(255,255,255,0.8); margin-bottom: 8px;">Peso por Metro</div>
      <div style="font-size: 38px; font-weight: 700; color: #fff; line-height: 1;">${weightPerM}</div>
      <div style="font-size: 16px; color: rgba(255,255,255,0.75); margin-top: 4px;">kg/m</div>
    </div>
    <div style="flex: 1; background: #0f172a; border-radius: 12px; padding: 22px 24px; text-align: center;">
      <div style="font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: rgba(255,255,255,0.6); margin-bottom: 8px;">Peso Total</div>
      <div style="font-size: 38px; font-weight: 700; color: #fff; line-height: 1;">${totalWeight}</div>
      <div style="font-size: 16px; color: rgba(255,255,255,0.5); margin-top: 4px;">kg</div>
    </div>
  </div>

  <!-- Memorial de Cálculo -->
  <div style="padding: 24px 32px;">
    <div style="font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #64748b; margin-bottom: 14px;">Memorial de Cálculo</div>
    <table style="width: 100%; border-collapse: collapse; font-size: 13.5px; font-family: 'Courier New', monospace;">
      <tbody>
        <tr style="border-bottom: 1px solid #e2e8f0;">
          <td style="padding: 9px 12px; color: #64748b; width: 55%;">Área da seção transversal = π × (OD × t − t²)</td>
          <td style="padding: 9px 12px; font-weight: 600; color: #0f172a;">${area.toFixed(4)} mm²</td>
        </tr>
        <tr style="background:#f8fafc; border-bottom: 1px solid #e2e8f0;">
          <td style="padding: 9px 12px; color: #64748b;">Peso linear = Área × Densidade ÷ 10⁶</td>
          <td style="padding: 9px 12px; font-weight: 600; color: #0f172a;">${(area * density / 1e6).toFixed(6)} kg/m</td>
        </tr>
        <tr style="border-bottom: 1px solid #e2e8f0;">
          <td style="padding: 9px 12px; color: #64748b;">Peso total = Peso linear × Comprimento</td>
          <td style="padding: 9px 12px; font-weight: 600; color: #0f172a;">${(area * density / 1e6 * parseFloat(length)).toFixed(4)} kg</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Rodapé -->
  <div style="border-top: 1px solid #e2e8f0; margin: 0 32px; padding: 16px 0; display: flex; justify-content: space-between; font-size: 11px; color: #94a3b8;">
    <span>Calculadora de Peso de Tubulação</span>
    <span>Gerado em ${now} • Valores calculados conforme ${norma}</span>
  </div>

</div>`;

            const container = document.createElement('div');
            container.innerHTML = html;
            document.body.appendChild(container);

            btn.style.display = 'none';
            const opt = {
                margin:     [10, 10, 10, 10],
                filename:   'calculo-peso-tubulacao.pdf',
                image:      { type: 'jpeg', quality: 1 },
                html2canvas:{ scale: 3, useCORS: true, backgroundColor: '#ffffff', logging: false },
                jsPDF:      { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(container).save().then(function() {
                document.body.removeChild(container);
                btn.style.display = 'block';
            });
        };

        // Inicialização
        window.onload = function() {
            updateInterface();
        };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</body>
